name: Publish one candidate image
description: Build and push an immutable candidate. The calling workflow tests all exact digests before signing.
inputs:
  image:
    description: Fully qualified image name without a tag.
    required: true
  dockerfile:
    description: Dockerfile path within the checked-out repository.
    required: true
  build-args:
    description: Public dependency image digests or build options.
    default: ''
outputs:
  digest:
    description: Published immutable image digest.
    value: ${{ steps.build.outputs.digest }}
runs:
  using: composite
  steps:
    - id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        platforms: linux/amd64
        push: true
        tags: ${{ inputs.image }}:${{ github.sha }}
        build-args: ${{ inputs.build-args }}
        provenance: mode=max
        # Syft runs as a checksum-pinned host executable below.
        sbom: false
    - name: Record the candidate digest
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        set -euo pipefail
        printf '%s@%s\n' "$IMAGE" "$DIGEST" >> image-digests.txt
