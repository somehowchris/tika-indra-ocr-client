name: CI
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check relative Markdown links and heading anchors
        run: sh scripts/check-markdown-links.sh
      - name: Lint workflows and shell scripts with pinned actionlint and shellcheck
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shellcheck"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz \
            --output "$RUNNER_TEMP/shellcheck/shellcheck.tar.xz"
          echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  $RUNNER_TEMP/shellcheck/shellcheck.tar.xz" | sha256sum --check --strict
          tar --extract --xz --file "$RUNNER_TEMP/shellcheck/shellcheck.tar.xz" --directory "$RUNNER_TEMP/shellcheck" \
            --strip-components=1 shellcheck-v0.10.0/shellcheck
          export PATH="$RUNNER_TEMP/shellcheck:$PATH"
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint/actionlint.tar.gz"
          # Upstream release asset digest, checked before extraction/execution.
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint/actionlint.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/actionlint/actionlint.tar.gz" --directory "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -version
          shellcheck --version
          "$RUNNER_TEMP/actionlint/actionlint"
          # Retained evidence packets are hash-bound records (see their SHA256SUMS)
          # and stay byte-identical; only maintained scripts are linted.
          git ls-files -z -- '*.sh' ':(exclude)*/evidence/*' | xargs -0 shellcheck --external-sources --severity=warning
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A shallow checkout: tests must not depend on history that only
          # auxiliary branches keep (frozen sources are committed snapshots).
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.16'
      - name: Install checksum-pinned build-tool test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r evaluation/build-cost/requirements.lock
      - name: Build tooling and immutable evidence invariants
        run: |
          for test in evaluation/build-cost/test_*.py; do
            python -B "$test"
            python -B -O "$test"
          done
          bash -n scripts/ablate-native-docker.sh tests/native-ablation-resources.sh
          bash tests/native-ablation-resources.sh
          bash -n scripts/admit-native-thread-study.sh scripts/test-native-ablation-control.sh tests/native-loop-counters.sh
          bash scripts/test-native-ablation-control.sh
          bash tests/native-loop-counters.sh
          bash -n scripts/lib/kind-cgroup.sh scripts/verify-kubernetes-native.sh tests/kind-cgroup.sh
          bash tests/kind-cgroup.sh
          bash tests/stage-locked-models.sh
          bash -n scripts/admit-current-http-reference.sh scripts/verify-native-http-reference.sh tests/current-http-reference.sh
          bash tests/current-http-reference.sh
          bash -n scripts/prepare-trace-helper.sh
          python -B tests/test_trace_helper_context.py -v
          python -B -O tests/test_trace_helper_context.py -v
          python -B -m unittest discover -s evaluation/report -p 'test_*.py' -v
          python -B -O -m unittest discover -s evaluation/report -p 'test_*.py' -v
          # Offline arithmetic/schema fixtures; actual replay separately requires Unicode 16.
          python -B -m unittest discover -s evaluation/independent -p 'test_*.py' -v
          python -B -O -m unittest discover -s evaluation/independent -p 'test_*.py' -v
          # Offline replay relocation, continuous admission arithmetic and controller plans.
          python -B evaluation/parity-replay/test_replay.py
          python -B -O evaluation/parity-replay/test_replay.py
          python -B tests/test_continuous_admission.py
          python -B -O tests/test_continuous_admission.py
          bash -n scripts/benchmark-continuous.sh scripts/test-benchmark-continuous.sh
          bash scripts/test-benchmark-continuous.sh
          # The evaluator workflow is path-filtered; its offline controller
          # fixtures also pin acquisition, fixture and protocol bytes.
          bash scripts/test-evaluate-ocr-matrix.sh
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: ./.github/actions/setup-nextest
      - name: Rust correctness and style for the whole root workspace
        run: |
          cargo fetch --locked
          cargo fmt --all --check
          # The runtime workspace's nextest profile lives under runtime/.config;
          # the root workspace uses nextest's defaults. --bins keeps the adapter's
          # argument-contract unit tests in the run. The streaming allocation
          # harness replaces libtest and cannot be listed by nextest, so it runs
          # with cargo test below.
          cargo nextest run --locked --offline --workspace --lib --bins --test bridge_protocol --test trace_wire
          cargo test --locked --offline --jobs 2 --test streaming_allocations
          cargo clippy --locked --offline --workspace --all-targets --jobs 2 -- -D warnings
          if grep -RnE --include='*.rs' '\bdyn\b|Vec<|Vec::|vec!\[|\.clone\(|\.to_owned\(|\banyhow\b' src shared/*/src; then
            exit 1
          else
            test "$?" -eq 1
          fi
      - name: Reject OpenSSL or native-tls in any lockfile
        run: |
          if grep -HnE '^name = "(openssl|openssl-sys|openssl-src|native-tls)"$' \
              Cargo.lock runtime/Cargo.lock runtime/proofs/batch-plan/Cargo.lock runtime/proofs/projector/Cargo.lock; then
            exit 1
          else
            test "$?" -eq 1
          fi
      - name: Static component SBOM writer for the Rust images
        run: bash tests/runtime-static-components.sh
      - name: GNU static build and real protocol tests
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked --offline --jobs 2 --target x86_64-unknown-linux-gnu
          bridge=target/x86_64-unknown-linux-gnu/release/indra-tesseract
          # Static PIE is valid; a program interpreter or a shared dependency is not.
          readelf -W -l "$bridge" > "$RUNNER_TEMP/bridge-program-headers.txt"
          readelf -W -d "$bridge" > "$RUNNER_TEMP/bridge-dynamic.txt"
          if grep -q INTERP "$RUNNER_TEMP/bridge-program-headers.txt"; then echo "dynamic ELF interpreter: $bridge" >&2; exit 1; fi
          if grep -q NEEDED "$RUNNER_TEMP/bridge-dynamic.txt"; then echo "dynamic ELF dependency: $bridge" >&2; exit 1; fi
          sha256sum "$bridge"
      - name: Protocol test against the exact static executable
        # Separate step: the static RUSTFLAGS above must not reach the host
        # proc-macro builds of the test target.
        run: |
          BRIDGE_BIN="$PWD/target/x86_64-unknown-linux-gnu/release/indra-tesseract" \
            cargo test --locked --offline --jobs 2 --test bridge_protocol
      - name: Signing harness and reference-backend unit tests
        run: |
          bash tests/sign-images.sh
          python -m pip install --require-hashes --only-binary=:all: -r backend/requirements.lock
          python -m unittest discover -s backend -p 'test_*.py' -v
      - name: Real backend HTTP and worker-recovery gates
        run: |
          python backend/fetch_models.py --output "$RUNNER_TEMP/indra-models"
          taskset -c 0,1 python scripts/verify_backend.py \
            --models "$RUNNER_TEMP/indra-models" --output "$RUNNER_TEMP/backend-validation"
      - name: Retain real backend verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-verification
          path: ${{ runner.temp }}/backend-validation
          if-no-files-found: warn

  report-figures:
    name: Seaborn synthetic smoke and visual-review receipts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.11'
      - name: Install the hash-locked reporting environment
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r evaluation/report/requirements.lock
      - name: Draw and verify every study figure from labelled synthetic rows
        env:
          MPLBACKEND: Agg
        run: |
          OCR_REPORT_SYNTHETIC_SMOKE="$RUNNER_TEMP/figure-smoke" python -B -m unittest discover -s evaluation/report -p 'test_figures.py' -v
          test "$(find "$RUNNER_TEMP/figure-smoke" -maxdepth 1 -name '*.png' | wc -l)" -eq 6
          python -B -m unittest discover -s evaluation/report -p 'test_visual_reviews.py' -v
      - name: Retain the labelled synthetic figures for visual review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-figure-smoke
          path: ${{ runner.temp }}/figure-smoke
          if-no-files-found: error
