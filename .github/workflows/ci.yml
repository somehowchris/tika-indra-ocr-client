name: CI
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows and shell scripts with pinned actionlint and shellcheck
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shellcheck"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz \
            --output "$RUNNER_TEMP/shellcheck/shellcheck.tar.xz"
          echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  $RUNNER_TEMP/shellcheck/shellcheck.tar.xz" | sha256sum --check --strict
          tar --extract --xz --file "$RUNNER_TEMP/shellcheck/shellcheck.tar.xz" --directory "$RUNNER_TEMP/shellcheck" \
            --strip-components=1 shellcheck-v0.10.0/shellcheck
          export PATH="$RUNNER_TEMP/shellcheck:$PATH"
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint/actionlint.tar.gz"
          # Upstream release asset digest, checked before extraction/execution.
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint/actionlint.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/actionlint/actionlint.tar.gz" --directory "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -version
          shellcheck --version
          "$RUNNER_TEMP/actionlint/actionlint"
          git ls-files -z -- '*.sh' | xargs -0 shellcheck --external-sources --severity=warning
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Frozen comparison tests read immutable historical Git objects.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.16'
      - name: Build tooling and immutable evidence invariants
        run: |
          for test in evaluation/build-cost/test_*.py; do
            python -B "$test"
            python -B -O "$test"
          done
          bash -n scripts/lib/kind-cgroup.sh scripts/verify-kubernetes-native.sh tests/kind-cgroup.sh
          bash tests/kind-cgroup.sh
          bash -n scripts/prepare-trace-helper.sh
          python -B tests/test_trace_helper_context.py -v
          python -B -O tests/test_trace_helper_context.py -v
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: ./.github/actions/setup-nextest
      - name: Rust correctness and style for the whole root workspace
        run: |
          cargo fetch --locked
          cargo fmt --all --check
          # The root workspace has no runtime crates, so the runtime nextest
          # profile (whose overrides name them) does not apply here.
          cargo nextest run --locked --offline --workspace
          cargo test --locked --offline --jobs 2 --test streaming_allocations
          cargo clippy --locked --offline --workspace --all-targets --jobs 2 -- -D warnings
          if grep -RnE --include='*.rs' '\bdyn\b|Vec<|Vec::|vec!\[|\.clone\(|\.to_owned\(|\banyhow\b' src shared/*/src; then
            exit 1
          else
            test "$?" -eq 1
          fi
      - name: Reject OpenSSL or native-tls in any lockfile
        run: |
          if grep -HnE '^name = "(openssl|openssl-sys|openssl-src|native-tls)"$' \
              Cargo.lock runtime/Cargo.lock runtime/proofs/batch-plan/Cargo.lock runtime/proofs/projector/Cargo.lock; then
            exit 1
          else
            test "$?" -eq 1
          fi
      - name: GNU static build and real protocol tests
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked --offline --jobs 2 --target x86_64-unknown-linux-gnu
          bridge=target/x86_64-unknown-linux-gnu/release/indra-tesseract
          # Static PIE is valid; a program interpreter or a shared dependency is not.
          readelf -W -l "$bridge" > "$RUNNER_TEMP/bridge-program-headers.txt"
          readelf -W -d "$bridge" > "$RUNNER_TEMP/bridge-dynamic.txt"
          if grep -q INTERP "$RUNNER_TEMP/bridge-program-headers.txt"; then echo "dynamic ELF interpreter: $bridge" >&2; exit 1; fi
          if grep -q NEEDED "$RUNNER_TEMP/bridge-dynamic.txt"; then echo "dynamic ELF dependency: $bridge" >&2; exit 1; fi
          sha256sum "$bridge"
      - name: Protocol test against the exact static executable
        # Separate step: the static RUSTFLAGS above must not reach the host
        # proc-macro builds of the test target.
        run: |
          BRIDGE_BIN="$PWD/target/x86_64-unknown-linux-gnu/release/indra-tesseract" \
            cargo test --locked --offline --jobs 2 --test bridge_protocol
      - name: Backend and benchmark invariant tests
        run: |
          bash tests/sign-images.sh
          python -m pip install --require-hashes --only-binary=:all: -r backend/requirements.lock
          python -m unittest discover -s backend -p 'test_*.py' -v
          python -m unittest discover -s tests -p 'test_benchmark*.py' -v
      - name: Validate benchmark CPU overrides with the real Compose parser
        env:
          OCR_COMPOSE_BINARY: docker
        run: python -m unittest discover -s tests -p 'test_benchmark_docker.py' -k real_compose -v
      - name: Real backend HTTP and worker-recovery gates
        run: |
          python backend/fetch_models.py --output "$RUNNER_TEMP/indra-models"
          taskset -c 0,1 python scripts/verify_backend.py \
            --models "$RUNNER_TEMP/indra-models" --output "$RUNNER_TEMP/backend-validation"
      - name: Retain real backend verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-verification
          path: ${{ runner.temp }}/backend-validation
          if-no-files-found: warn
