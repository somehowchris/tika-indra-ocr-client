name: Native GNU runtime
on:
  push:
    branches: ['stack/03-native-build', 'recovery/**']
    paths:
      - 'scripts/build-native-runtime.sh'
      - 'scripts/record-native-runtime.sh'
      - 'scripts/native-build-tools.lock'
      - 'docker/native.Dockerfile'
      - '.github/workflows/native-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-gnu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          version: v29.9.1
          daemon-config: '{"exec-opts":["native.cgroupdriver=systemd"],"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker
      - name: Record the execution scope
        run: |
          mkdir -p native-evidence
          printf 'commit=%s\nbuild_cpu_affinity=0,1\nnative_build_parallelism=2\nbenchmark_cfs_proof=false\n' "$GITHUB_SHA" > native-evidence/caller.txt
          lscpu >> native-evidence/caller.txt
          docker version >> native-evidence/caller.txt
      - name: Build pinned GNU archives and export their effective configuration
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/native.Dockerfile
          platforms: linux/amd64
          target: native-evidence
          outputs: type=local,dest=native-evidence/build
          build-args: BUILD_CPUSET=0,1
          cache-from: type=gha,scope=indra-native-gnu-v1
          cache-to: type=gha,mode=max,scope=indra-native-gnu-v1
          provenance: false
          sbom: false
      - name: Preserve completed build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-gnu-build-evidence
          path: native-evidence
          if-no-files-found: error
          retention-days: 90
