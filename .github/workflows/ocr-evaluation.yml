name: Scientific OCR evaluation

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      release_run_id:
        type: string
        required: true
      release_run_attempt:
        type: string
        required: true
      candidate_artifact:
        type: string
        required: true
      include_laboratory:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      source_sha:
        description: Published 40-character candidate source commit
        type: string
        required: true
      release_run_id:
        description: Exact Signed release workflow run ID
        type: string
        required: true
      release_run_attempt:
        description: Exact release attempt number
        type: string
        required: true
      candidate_artifact:
        description: ocr-candidates-SHA-RUN-ATTEMPT
        type: string
        required: true
      include_laboratory:
        description: Include the separate two-crop laboratory supplement
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  matrix:
    name: Frozen matrix / ${{ matrix.cpus }} CPU
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        cpus: [1, 2]
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      RELEASE_RUN_ATTEMPT: ${{ inputs.release_run_attempt }}
      CANDIDATE_ARTIFACT: ${{ inputs.candidate_artifact }}
      INCLUDE_LABORATORY: ${{ inputs.include_laboratory }}
      CPU_BUDGET: ${{ matrix.cpus }}
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Validate immutable invocation identity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_ARTIFACT" == "ocr-candidates-${SOURCE_SHA}-${RELEASE_RUN_ID}-${RELEASE_RUN_ATTEMPT}" ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Download this exact signed release attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.candidate_artifact }}
          path: ${{ runner.temp }}/ocr-evaluation-candidates
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          version: v29.9.1
          daemon-config: |
            {"exec-opts":["native.cgroupdriver=systemd"],"features":{"containerd-snapshotter":true}}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Build and test the published locked Rust evaluator
        timeout-minutes: 30
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/ocr-evaluation-build"
          rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
          rustc +1.99.1 -Vv > "$RUNNER_TEMP/ocr-evaluation-build/rustc.txt"
          cargo +1.99.1 fmt --manifest-path evaluation/runner/Cargo.toml --check
          cargo +1.99.1 test --manifest-path evaluation/runner/Cargo.toml --locked --lib 2>&1 | tee "$RUNNER_TEMP/ocr-evaluation-build/tests.log"
          cargo +1.99.1 clippy --manifest-path evaluation/runner/Cargo.toml --locked --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/ocr-evaluation-build/clippy.log"
          cargo +1.99.1 build --manifest-path evaluation/runner/Cargo.toml --locked --release 2>&1 | tee "$RUNNER_TEMP/ocr-evaluation-build/build.log"
          bash scripts/test-evaluate-ocr-matrix.sh 2>&1 | tee "$RUNNER_TEMP/ocr-evaluation-build/orchestration-fixtures.log"
          cp evaluation/runner/target/release/indra-evaluate "$RUNNER_TEMP/ocr-evaluation-build/indra-evaluate"
          sha256sum "$RUNNER_TEMP/ocr-evaluation-build/indra-evaluate" > "$RUNNER_TEMP/ocr-evaluation-build/evaluator.sha256"
      - name: Execute all eight arms serially on this budget's host
        timeout-minutes: 310
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          # A finite wall limit preserves partial evidence instead of hiding a
          # slow/failing arm or silently reducing its frozen workload.
          timeout --signal=TERM --kill-after=480s 18000s bash scripts/evaluate-ocr-matrix.sh \
            --evaluator "$RUNNER_TEMP/ocr-evaluation-build/indra-evaluate" \
            --candidates "$RUNNER_TEMP/ocr-evaluation-candidates/candidates.json" \
            --bundle "$RUNNER_TEMP/ocr-evaluation-candidates/candidates.sigstore.json" \
            --repository "$GITHUB_REPOSITORY" --source-sha "$SOURCE_SHA" \
            --release-run-id "$RELEASE_RUN_ID" --release-run-attempt "$RELEASE_RUN_ATTEMPT" \
            --include-laboratory "$INCLUDE_LABORATORY" --cpus "$CPU_BUDGET" \
            --work "$RUNNER_TEMP/ocr-evaluation-work" --output "$RUNNER_TEMP/ocr-evaluation-results"
      - name: Retain every available outcome, raw response and provenance file
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocr-evaluation-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-cpu${{ matrix.cpus }}
          path: |
            ${{ runner.temp }}/ocr-evaluation-results
            ${{ runner.temp }}/ocr-evaluation-build
            ${{ runner.temp }}/ocr-evaluation-candidates
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90

  aggregate:
    name: Verify and aggregate both budget artifacts
    needs: matrix
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Download CPU1 evidence
        id: cpu_one
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-evaluation-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-cpu1
          path: ${{ runner.temp }}/ocr-cpu1
          digest-mismatch: error
      - name: Download CPU2 evidence
        id: cpu_two
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-evaluation-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-cpu2
          path: ${{ runner.temp }}/ocr-cpu2
          digest-mismatch: error
      - name: Fail closed on changed, missing or incomplete evidence
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_RUN_ATTEMPT: ${{ inputs.release_run_attempt }}
          INCLUDE_LABORATORY: ${{ inputs.include_laboratory }}
          CPU_ONE_DOWNLOAD_STATUS: ${{ steps.cpu_one.outcome }}
          CPU_TWO_DOWNLOAD_STATUS: ${{ steps.cpu_two.outcome }}
        run: |
          set -Eeuo pipefail
          bash scripts/aggregate-ocr-evaluation.sh \
            --cpu-one "$RUNNER_TEMP/ocr-cpu1" --cpu-two "$RUNNER_TEMP/ocr-cpu2" \
            --cpu-one-download-status "$CPU_ONE_DOWNLOAD_STATUS" --cpu-two-download-status "$CPU_TWO_DOWNLOAD_STATUS" \
            --output "$RUNNER_TEMP/ocr-evaluation-combined" --repository "$GITHUB_REPOSITORY" \
            --source-sha "$SOURCE_SHA" --release-run-id "$RELEASE_RUN_ID" --release-run-attempt "$RELEASE_RUN_ATTEMPT" \
            --include-laboratory "$INCLUDE_LABORATORY"
      - name: Retain the complete planned index, including missing cells
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocr-evaluation-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-combined
          path: ${{ runner.temp }}/ocr-evaluation-combined
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90
