name: Scientific OCR evaluation

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      release_run_id:
        type: string
        required: true
      release_run_attempt:
        type: string
        required: true
      candidate_artifact:
        type: string
        required: true
      include_laboratory:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      source_sha:
        description: Published 40-character candidate source commit
        type: string
        required: true
      release_run_id:
        description: Exact Signed release workflow run ID
        type: string
        required: true
      release_run_attempt:
        description: Exact release attempt number
        type: string
        required: true
      candidate_artifact:
        description: ocr-candidates-SHA-RUN-ATTEMPT
        type: string
        required: true
      include_laboratory:
        description: Include the separate two-crop laboratory supplement
        type: boolean
        default: true
      report_evidence:
        description: >-
          Render only. The combined evidence artifact of a sealed measurement
          (ocr-evaluation-SHA-RUN-ATTEMPT-combined) in the run named by
          release_run_id; the evaluator, matrix and aggregate jobs do not run.
        type: string
        default: ''

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  evaluator:
    # Both budgets must execute identical evaluator bytes: the aggregate admits
    # the second budget only with the first budget's evaluator SHA-256, and two
    # release builds of the same source are not byte-identical.
    name: Build and test the locked Rust evaluator once
    if: ${{ !inputs.report_evidence }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Build and test the published locked Rust evaluator
        timeout-minutes: 30
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/ocr-evaluation-build"
          rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
          rustc +1.99.1 -Vv > "$RUNNER_TEMP/ocr-evaluation-build/rustc.txt"
          cargo +1.99.1 fmt --manifest-path evaluation/runner/Cargo.toml --check
          cargo +1.99.1 test --manifest-path evaluation/runner/Cargo.toml --locked --lib 2>&1 | tee "$RUNNER_TEMP/ocr-evaluation-build/tests.log"
          cargo +1.99.1 clippy --manifest-path evaluation/runner/Cargo.toml --locked --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/ocr-evaluation-build/clippy.log"
          cargo +1.99.1 build --manifest-path evaluation/runner/Cargo.toml --locked --release 2>&1 | tee "$RUNNER_TEMP/ocr-evaluation-build/build.log"
          bash scripts/test-evaluate-ocr-matrix.sh 2>&1 | tee "$RUNNER_TEMP/ocr-evaluation-build/orchestration-fixtures.log"
          cp evaluation/runner/target/release/indra-evaluate "$RUNNER_TEMP/ocr-evaluation-build/indra-evaluate"
          (cd "$RUNNER_TEMP/ocr-evaluation-build" && sha256sum indra-evaluate > evaluator.sha256)
      - name: Publish the evaluator, its build record and fixture logs for both budgets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocr-evaluation-build-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ocr-evaluation-build
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  matrix:
    name: Frozen matrix / ${{ matrix.cpus }} CPU
    needs: evaluator
    if: ${{ !inputs.report_evidence }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        cpus: [1, 2]
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      RELEASE_RUN_ATTEMPT: ${{ inputs.release_run_attempt }}
      CANDIDATE_ARTIFACT: ${{ inputs.candidate_artifact }}
      INCLUDE_LABORATORY: ${{ inputs.include_laboratory }}
      CPU_BUDGET: ${{ matrix.cpus }}
    steps:
      - name: Validate immutable invocation identity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_ARTIFACT" == "ocr-candidates-${SOURCE_SHA}-${RELEASE_RUN_ID}-${RELEASE_RUN_ATTEMPT}" ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Download this exact signed release attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.candidate_artifact }}
          path: ${{ runner.temp }}/ocr-evaluation-candidates
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          version: v29.9.1
          daemon-config: |
            {"exec-opts":["native.cgroupdriver=systemd"],"features":{"containerd-snapshotter":true}}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Download the one evaluator both budgets execute
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-evaluation-build-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ocr-evaluation-build
          digest-mismatch: error
      - name: Admit the evaluator bytes the build job recorded
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/ocr-evaluation-build"
          sha256sum --check --strict evaluator.sha256
          chmod 0755 indra-evaluate
          ./indra-evaluate --version
      - name: Execute all six arms serially on this budget's host
        timeout-minutes: 310
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          # The controller bounds every arm by its own wall budget and seals
          # the retained evidence itself; the outer limit is the backstop that
          # ends a controller which no longer seals.
          timeout --signal=TERM --kill-after=480s 18000s bash scripts/evaluate-ocr-matrix.sh \
            --wall-seconds 17400 \
            --evaluator "$RUNNER_TEMP/ocr-evaluation-build/indra-evaluate" \
            --candidates "$RUNNER_TEMP/ocr-evaluation-candidates/candidates.json" \
            --bundle "$RUNNER_TEMP/ocr-evaluation-candidates/candidates.sigstore.json" \
            --repository "$GITHUB_REPOSITORY" --source-sha "$SOURCE_SHA" \
            --release-run-id "$RELEASE_RUN_ID" --release-run-attempt "$RELEASE_RUN_ATTEMPT" \
            --include-laboratory "$INCLUDE_LABORATORY" --cpus "$CPU_BUDGET" \
            --work "$RUNNER_TEMP/ocr-evaluation-work" --output "$RUNNER_TEMP/ocr-evaluation-results"
      - name: Retain every available outcome, raw response and provenance file
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocr-evaluation-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-cpu${{ matrix.cpus }}
          path: |
            ${{ runner.temp }}/ocr-evaluation-results
            ${{ runner.temp }}/ocr-evaluation-build
            ${{ runner.temp }}/ocr-evaluation-candidates
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90

  aggregate:
    name: Verify and aggregate both budget artifacts
    needs: matrix
    if: ${{ always() && !inputs.report_evidence }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Download CPU1 evidence
        id: cpu_one
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-evaluation-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-cpu1
          path: ${{ runner.temp }}/ocr-cpu1
          digest-mismatch: error
      - name: Download CPU2 evidence
        id: cpu_two
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-evaluation-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-cpu2
          path: ${{ runner.temp }}/ocr-cpu2
          digest-mismatch: error
      - name: Fail closed on changed, missing or incomplete evidence
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_RUN_ATTEMPT: ${{ inputs.release_run_attempt }}
          INCLUDE_LABORATORY: ${{ inputs.include_laboratory }}
          CPU_ONE_DOWNLOAD_STATUS: ${{ steps.cpu_one.outcome }}
          CPU_TWO_DOWNLOAD_STATUS: ${{ steps.cpu_two.outcome }}
        run: |
          set -Eeuo pipefail
          bash scripts/aggregate-ocr-evaluation.sh \
            --cpu-one "$RUNNER_TEMP/ocr-cpu1" --cpu-two "$RUNNER_TEMP/ocr-cpu2" \
            --cpu-one-download-status "$CPU_ONE_DOWNLOAD_STATUS" --cpu-two-download-status "$CPU_TWO_DOWNLOAD_STATUS" \
            --output "$RUNNER_TEMP/ocr-evaluation-combined" --repository "$GITHUB_REPOSITORY" \
            --source-sha "$SOURCE_SHA" --release-run-id "$RELEASE_RUN_ID" --release-run-attempt "$RELEASE_RUN_ATTEMPT" \
            --include-laboratory "$INCLUDE_LABORATORY"
      - name: Retain the complete planned index, including missing cells
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocr-evaluation-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-combined
          path: ${{ runner.temp }}/ocr-evaluation-combined
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90

  report:
    name: Render the reproducible Quarto/Seaborn report
    needs: aggregate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Name the sealed measurement this render binds
        id: evidence
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          REPORT_EVIDENCE: ${{ inputs.report_evidence }}
        run: |
          set -Eeuo pipefail
          if [[ -z $REPORT_EVIDENCE ]]; then
            name=ocr-evaluation-$SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-combined
            run=$GITHUB_RUN_ID; evidence_sha=$SOURCE_SHA
          else
            # A re-render of a sealed measurement: the evidence names its own
            # source; this checkout only supplies the report code.
            [[ $REPORT_EVIDENCE =~ ^ocr-evaluation-([a-f0-9]{40})-([1-9][0-9]*)-([1-9][0-9]*)-combined$ ]]
            evidence_sha=${BASH_REMATCH[1]}; run=${BASH_REMATCH[2]}
            [[ $run == "$RELEASE_RUN_ID" ]]
            name=$REPORT_EVIDENCE
          fi
          printf 'name=%s\nrun=%s\nsource_sha=%s\n' "$name" "$run" "$evidence_sha" >> "$GITHUB_OUTPUT"
      - name: Download the combined evidence (absent or partial evidence still renders)
        id: combined
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.evidence.outputs.name }}
          path: ${{ runner.temp }}/ocr-evaluation-combined
          run-id: ${{ steps.evidence.outputs.run }}
          github-token: ${{ github.token }}
          digest-mismatch: error
      # The uv version and archive digest are recorded in evaluation/report/tools.json.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          checksum: eadd9d27c134ab5ac1ffd4473b97a741407f3ea238288f03121fc4deddf90220
          enable-cache: false
      - name: Render with Python 3.12.11, the hash-locked Seaborn environment and pinned Quarto
        shell: bash
        env:
          EVIDENCE_SOURCE_SHA: ${{ steps.evidence.outputs.source_sha }}
          COMBINED_DOWNLOAD_STATUS: ${{ steps.combined.outcome }}
        run: |
          set -Eeuo pipefail
          uv --version
          if [[ "$COMBINED_DOWNLOAD_STATUS" == success && -f "$RUNNER_TEMP/ocr-evaluation-combined/study-index.json" ]]; then
            export OCR_EVALUATION_ROOT="$RUNNER_TEMP/ocr-evaluation-combined"
            export OCR_EVALUATION_SOURCE_SHA="$EVIDENCE_SOURCE_SHA"
          else
            printf 'Combined evidence unavailable (%s); rendering every planned cell as unsubmitted.\n' "$COMBINED_DOWNLOAD_STATUS"
          fi
          bash evaluation/report/render.sh
      - name: Retain render evidence, exported study data, figures and the HTML
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocr-report-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evaluation/report/render-evidence
            evaluation/report/study-data
            evaluation/report/report.html
            evaluation/figures
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90
