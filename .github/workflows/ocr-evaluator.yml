name: OCR evaluator
on:
  pull_request:
    paths:
      - 'evaluation/runner/**'
      - 'evaluation/laboratory-supplement/**'
      - 'evaluation/audits/**'
      - 'evaluation/protocol.json'
      - 'evaluation/corpus-frozen.json'
      - 'evaluation/fixtures/legal-raster.json'
      - 'scripts/*evaluat*'
      - '.github/workflows/ocr-evaluator.yml'
      - '.github/actions/setup-nextest/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'

jobs:
  evaluator:
    name: Locked evaluator and offline controller fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned GNU Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - uses: ./.github/actions/setup-nextest
      - name: Format, lint and test the evaluator
        run: |
          cargo +1.99.1 fmt --manifest-path evaluation/runner/Cargo.toml --check
          cargo +1.99.1 clippy --manifest-path evaluation/runner/Cargo.toml --locked --all-targets -- -D warnings
          cargo +1.99.1 nextest run --manifest-path evaluation/runner/Cargo.toml --locked --no-fail-fast
      - name: Offline matrix controller, hermetic acquisition and aggregation fixtures
        run: bash scripts/test-evaluate-ocr-matrix.sh
