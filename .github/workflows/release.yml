name: Signed release
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'README.md'
      - 'IMPLEMENTATION_REPORT.md'
      - 'SOURCE_MANIFEST.json'
      - 'docs/design.md'
      - 'docs/results.md'
      - 'research/**'
      - 'validation/**'
      - 'benchmarks/README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          version: v29.9.1
          daemon-config: '{"exec-opts":["native.cgroupdriver=systemd"],"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0
          driver: docker
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Install the pinned SBOM executable
        run: |
          python3 scripts/install_syft.py --directory "$RUNNER_TEMP/ocr-tools"
          printf '%s\n' "$RUNNER_TEMP/ocr-tools" >> "$GITHUB_PATH"
      - name: Verify distroless base-image signatures
        run: |
          cosign verify --certificate-identity keyless@distroless.iam.gserviceaccount.com \
            --certificate-oidc-issuer https://accounts.google.com \
            gcr.io/distroless/java21-debian13@sha256:51c242e7ddaba3666d47115a76a19cfa5076b2ad3ed6077b30d7bac689d98fa1
          cosign verify --certificate-identity keyless@distroless.iam.gserviceaccount.com \
            --certificate-oidc-issuer https://accounts.google.com \
            gcr.io/distroless/python3-debian13@sha256:83aa8d4f74a4d7f7cf2d472054139bef71a927b76c680c0f2e1021d6b1d6d732
      - name: Choose valid registry names
        shell: bash
        run: printf 'IMAGE_PREFIX=ghcr.io/%s/tika-indra\n' "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - id: bridge
        uses: ./.github/actions/publish-image
        with:
          image: ${{ env.IMAGE_PREFIX }}-bridge
          dockerfile: docker/bridge.Dockerfile
      - id: tika
        uses: ./.github/actions/publish-image
        with:
          image: ${{ env.IMAGE_PREFIX }}-tika
          dockerfile: docker/tika.Dockerfile
          build-args: BRIDGE_IMAGE=${{ env.IMAGE_PREFIX }}-bridge@${{ steps.bridge.outputs.digest }}
      - id: indra
        uses: ./.github/actions/publish-image
        with:
          image: ${{ env.IMAGE_PREFIX }}-backend
          dockerfile: backend/Dockerfile
      - id: tesseract
        uses: ./.github/actions/publish-image
        with:
          image: ${{ env.IMAGE_PREFIX }}-tesseract
          dockerfile: docker/tesseract.Dockerfile
          build-args: TIKA_IMAGE=${{ env.IMAGE_PREFIX }}-tika@${{ steps.tika.outputs.digest }}
      - name: Pull the exact published candidates for runtime checks
        env:
          TIKA_REF: ${{ env.IMAGE_PREFIX }}-tika@${{ steps.tika.outputs.digest }}
          INDRA_REF: ${{ env.IMAGE_PREFIX }}-backend@${{ steps.indra.outputs.digest }}
          TESSERACT_REF: ${{ env.IMAGE_PREFIX }}-tesseract@${{ steps.tesseract.outputs.digest }}
        run: |
          docker pull "$TIKA_REF"
          docker pull "$INDRA_REF"
          docker pull "$TESSERACT_REF"
          docker tag "$TIKA_REF" tika-indra:dev
          docker tag "$INDRA_REF" indra-backend:dev
          docker tag "$TESSERACT_REF" tika-tesseract:dev
      - name: Test the published Indra candidates at both total CPU budgets
        run: |
          docker compose -f compose.yaml up -d --no-build --wait --wait-timeout 180
          python3 scripts/smoke_stack.py
          docker compose -f compose.yaml down
          docker compose -f compose.yaml -f compose.2cpu.yaml up -d --no-build --wait --wait-timeout 180
          python3 scripts/smoke_stack.py
          docker compose -f compose.yaml -f compose.2cpu.yaml down
      - name: Test the published Tesseract baseline at both CPU budgets
        run: |
          docker compose -f compose.tesseract.yaml up -d --no-build --wait --wait-timeout 180
          python3 scripts/smoke_stack.py
          docker compose -f compose.tesseract.yaml down
          docker compose -f compose.tesseract.yaml -f compose.tesseract.2cpu.yaml up -d --no-build --wait --wait-timeout 180
          python3 scripts/smoke_stack.py
          docker compose -f compose.tesseract.yaml -f compose.tesseract.2cpu.yaml down
      - name: Test the published Indra candidates in Kubernetes
        run: python3 scripts/verify_kubernetes.py --output "$RUNNER_TEMP/kubernetes-release-validation"
      - name: Retain Kubernetes candidate verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubernetes-verification-release
          path: ${{ runner.temp }}/kubernetes-release-validation
          if-no-files-found: warn
      - name: Sign, attest and verify the tested digests
        shell: bash
        run: bash scripts/sign-images.sh image-digests.txt "$RUNNER_TEMP/image-signing" "https://github.com/$GITHUB_WORKFLOW_REF"
      - name: Retain bounded signing and verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-signing
          path: ${{ runner.temp }}/image-signing
          if-no-files-found: warn
      - name: Measure signed images at both total CPU budgets
        env:
          TIKA_REF: ${{ env.IMAGE_PREFIX }}-tika@${{ steps.tika.outputs.digest }}
          INDRA_REF: ${{ env.IMAGE_PREFIX }}-backend@${{ steps.indra.outputs.digest }}
          BASELINE_REF: ${{ env.IMAGE_PREFIX }}-tesseract@${{ steps.tesseract.outputs.digest }}
        run: |
          for policy in shared deployment; do
            python3 benchmarks/ci_docker.py matrix \
              --tika-ref "$TIKA_REF" \
              --backend-ref "$INDRA_REF" \
              --baseline-ref "$BASELINE_REF" \
              --identity "https://github.com/$GITHUB_WORKFLOW_REF" \
              --cpu-policy "$policy" \
              --output "$RUNNER_TEMP/ocr-container-benchmark/$policy"
          done
      - name: Publish measured comparison to the job summary
        if: always()
        run: |
          for policy in shared deployment; do
            if test -f "$RUNNER_TEMP/ocr-container-benchmark/$policy/report.md"; then
              cat "$RUNNER_TEMP/ocr-container-benchmark/$policy/report.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Retain container benchmark evidence, including failed attempts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-container-benchmark
          path: ${{ runner.temp }}/ocr-container-benchmark
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-image-digests
          path: image-digests.txt
          if-no-files-found: error
      - name: Cleanup
        if: always()
        run: |
          docker compose -f compose.yaml logs --no-color
          docker compose -f compose.yaml down --remove-orphans
          docker compose -f compose.tesseract.yaml logs --no-color
          docker compose -f compose.tesseract.yaml down --remove-orphans
