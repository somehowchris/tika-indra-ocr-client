name: Signed release
on:
  push:
    branches: [main, 'stack/11-signed-release']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      run_sdk_proof:
        description: Publish signed SDK and cooked dependencies, then prove seven roles on a fresh hosted runner
        type: boolean
        default: false
      run_evaluation:
        description: Run the separate hosted scientific matrix after signing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Do not interrupt accepted deployment work or a partially written signature.
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stack/11-signed-release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      source_sha: ${{ steps.candidates.outputs.source_sha }}
      release_run_id: ${{ steps.candidates.outputs.release_run_id }}
      release_run_attempt: ${{ steps.candidates.outputs.release_run_attempt }}
      candidate_artifact: ${{ steps.candidates.outputs.candidate_artifact }}
      native_build_artifact: ${{ steps.build_inputs.outputs.artifact }}
      native_reference: ${{ steps.native.outputs.reference }}
      gateway_reference: ${{ steps.gateway.outputs.reference }}
      bridge_reference: ${{ steps.bridge.outputs.reference }}
      tika_reference: ${{ steps.tika.outputs.reference }}
      tesseract_reference: ${{ steps.tesseract.outputs.reference }}
      backend_reference: ${{ steps.backend.outputs.reference }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the signing controller before any registry write
        run: |
          mkdir -p release-evidence/tools release-evidence/base-signatures
          bash -n scripts/sign-images.sh scripts/verify-release-images.sh scripts/verify-image-provenance.sh scripts/verify-daemon-image.sh scripts/verify-cri-image.sh scripts/collect-runtime-materials.sh
          bash tests/sign-images.sh
          bash tests/image-provenance.sh
          bash tests/release-images.sh
          bash tests/release-traces.sh
          bash tests/daemon-image-identity.sh "$PWD/release-evidence/daemon-fixtures"
          bash tests/cri-image-identity.sh > release-evidence/cri-fixtures.log
          bash tests/cri-version.sh > release-evidence/cri-version-fixtures.log
          [[ $(git rev-parse HEAD) = "$GITHUB_SHA" ]]
          git diff --quiet HEAD --
          git ls-files -z | xargs -0 -r sha256sum > release-evidence/source-files.sha256
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          version: v29.9.1
          daemon-config: '{"exec-opts":["native.cgroupdriver=systemd"],"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0
          driver: docker
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Install checksum-pinned SBOM and raw OCI readers
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/ocr-release-tools"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 180 --retry 2 --retry-max-time 240 \
            https://github.com/anchore/syft/releases/download/v1.54.1/syft_1.54.1_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/ocr-release-tools/syft.tar.gz"
          printf '%s  %s\n' c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47 \
            "$RUNNER_TEMP/ocr-release-tools/syft.tar.gz" | sha256sum --check --status
          tar -xOf "$RUNNER_TEMP/ocr-release-tools/syft.tar.gz" syft > "$RUNNER_TEMP/ocr-release-tools/syft"
          chmod 0755 "$RUNNER_TEMP/ocr-release-tools/syft"
          "$RUNNER_TEMP/ocr-release-tools/syft" version > release-evidence/tools/syft-version.txt
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 180 --retry 2 --retry-max-time 240 \
            https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz \
            --output "$RUNNER_TEMP/ocr-release-tools/crane.tar.gz"
          printf '%s  %s\n' 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0 \
            "$RUNNER_TEMP/ocr-release-tools/crane.tar.gz" | sha256sum --check --status
          tar -xOf "$RUNNER_TEMP/ocr-release-tools/crane.tar.gz" crane > "$RUNNER_TEMP/ocr-release-tools/crane"
          chmod 0755 "$RUNNER_TEMP/ocr-release-tools/crane"
          "$RUNNER_TEMP/ocr-release-tools/crane" version > release-evidence/tools/crane-version.txt
          cosign version > release-evidence/tools/cosign-version.txt
          printf '%s\n' "$RUNNER_TEMP/ocr-release-tools" >> "$GITHUB_PATH"
          printf '%s\n' 'syft_1.54.1_linux_amd64.tar.gz sha256:c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47' \
            > release-evidence/tools/syft-download.txt
          printf '%s\n' 'go-containerregistry_Linux_x86_64.tar.gz sha256:0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0' \
            > release-evidence/tools/crane-download.txt
      - name: Verify the pinned distroless base signatures
        shell: bash
        run: |
          set -euo pipefail
          for runtime in java21 python3; do
            case "$runtime" in
              java21) digest=51c242e7ddaba3666d47115a76a19cfa5076b2ad3ed6077b30d7bac689d98fa1;;
              python3) digest=83aa8d4f74a4d7f7cf2d472054139bef71a927b76c680c0f2e1021d6b1d6d732;;
            esac
            passed=0
            for attempt in 1 2 3; do
              status=0
              timeout --signal=TERM --kill-after=10s 180s cosign verify \
                --certificate-identity keyless@distroless.iam.gserviceaccount.com \
                --certificate-oidc-issuer https://accounts.google.com \
                "gcr.io/distroless/$runtime-debian13@sha256:$digest" \
                < /dev/null > "release-evidence/base-signatures/$runtime-$attempt.stdout" \
                2> "release-evidence/base-signatures/$runtime-$attempt.stderr" || status=$?
              printf '%s\t%s\t%s\n' "$runtime" "$attempt" "$status" >> release-evidence/base-signatures/steps.tsv
              if (( status == 0 )); then passed=1; break; fi
              tail -c 4096 "release-evidence/base-signatures/$runtime-$attempt.stderr" >&2
              if (( attempt < 3 )); then sleep 2; fi
            done
            (( passed == 1 ))
          done
      - name: Choose the registry namespace
        shell: bash
        run: printf 'IMAGE_PREFIX=ghcr.io/%s/tika-indra\n' "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      # These targets contain the production builds plus actual test executables.
      # Publishing their production targets below reuses the same local layers.
      # GHA cache access still follows current/base/default-branch restrictions:
      # https://docs.docker.com/build/cache/backends/gha/#scope
      - name: Plan owned release-native-acceptance cache
        id: cache_release_native_acceptance
        run: python3 scripts/cache-plan.py release-native-acceptance >> "$GITHUB_OUTPUT"
      - name: Build the native production service and its real acceptance gates once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/native.Dockerfile
          target: server-acceptance
          platforms: linux/amd64
          load: true
          tags: indra-server-acceptance:test
          build-args: BUILD_CPUSET=0,1
          cache-from: ${{ steps.cache_release_native_acceptance.outputs.cache_from }}
          cache-to: ${{ steps.cache_release_native_acceptance.outputs.cache_to }}
          provenance: false
          sbom: false
      - name: Plan owned release-gateway-acceptance cache
        id: cache_release_gateway_acceptance
        run: python3 scripts/cache-plan.py release-gateway-acceptance >> "$GITHUB_OUTPUT"
      - name: Build the gateway production binary and its real acceptance gates once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/gateway.Dockerfile
          target: gateway-acceptance
          platforms: linux/amd64
          load: true
          tags: indra-gateway-acceptance:test
          cache-from: ${{ steps.cache_release_gateway_acceptance.outputs.cache_from }}
          cache-to: ${{ steps.cache_release_gateway_acceptance.outputs.cache_to }}
          provenance: false
          sbom: false
      - id: native
        uses: ./.github/actions/publish-image
        with:
          role: native
          image: ${{ env.IMAGE_PREFIX }}-native
          dockerfile: docker/native.Dockerfile
          target: server
          build-args: BUILD_CPUSET=0,1
      - id: gateway
        uses: ./.github/actions/publish-image
        with:
          role: gateway
          image: ${{ env.IMAGE_PREFIX }}-gateway
          dockerfile: docker/gateway.Dockerfile
          target: gateway
      - id: bridge
        uses: ./.github/actions/publish-image
        with:
          role: bridge
          image: ${{ env.IMAGE_PREFIX }}-bridge
          dockerfile: docker/bridge.Dockerfile
      - id: tika
        uses: ./.github/actions/publish-image
        with:
          role: tika
          image: ${{ env.IMAGE_PREFIX }}-tika
          dockerfile: docker/tika.Dockerfile
          target: runtime
          build-args: |
            BRIDGE_IMAGE=${{ steps.bridge.outputs.reference }}
            GATEWAY_IMAGE=${{ steps.gateway.outputs.reference }}
      - id: tesseract
        uses: ./.github/actions/publish-image
        with:
          role: tesseract
          image: ${{ env.IMAGE_PREFIX }}-tesseract
          dockerfile: docker/tesseract.Dockerfile
          target: runtime
          build-args: TIKA_IMAGE=${{ steps.tika.outputs.reference }}
      - id: backend
        uses: ./.github/actions/publish-image
        with:
          role: backend
          image: ${{ env.IMAGE_PREFIX }}-backend
          dockerfile: backend/Dockerfile
      - name: Bind exact candidate images to static checks and complete source materials
        run: bash scripts/verify-release-images.sh prepare release-evidence
      - name: Run real native and gateway process gates at 1 and 2 CPU
        run: bash scripts/verify-release-images.sh process release-evidence
      - name: Finish accepted native OCR during real Compose shutdown
        env:
          INDRA_IMAGE: ${{ steps.native.outputs.reference }}
          TIKA_IMAGE: ${{ steps.tika.outputs.reference }}
        run: bash scripts/verify-compose-native.sh "$PWD/release-evidence/bin/indra-stack-acceptance" "$PWD/release-evidence/compose"
      - name: Finish accepted native OCR during real Kubernetes sidecar shutdown
        run: bash scripts/verify-kubernetes-native.sh "$PWD/release-evidence/bin/indra-stack-acceptance" "$PWD/release-evidence/kubernetes"
      - name: Verify the exact Python-reference and Tesseract Tika candidates at both caps
        run: bash scripts/verify-release-images.sh references release-evidence
      - name: Verify actual gateway, forked Java, bridge and native OTLP graph before signing
        env:
          TIKA_REF: ${{ steps.tika.outputs.reference }}
          NATIVE_REF: ${{ steps.native.outputs.reference }}
        run: |
          tools=$(jq -er .image_id release-evidence/acceptance-build/gateway/resolution/result.json)
          docker build --platform linux/amd64 -f docker/trace-acceptance.Dockerfile \
            --build-arg TIKA_IMAGE="$TIKA_REF" --build-arg NATIVE_IMAGE="$NATIVE_REF" \
            --build-arg GATEWAY_TOOLS_IMAGE="$tools" -t indra-trace-acceptance:release .
          bash scripts/verify-trace-native.sh indra-trace-acceptance:release \
            "$PWD/release-evidence/models" "$PWD/release-evidence/tracing"
      - name: Index the completed gates and sign all exact digests, SBOMs and evidence
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-release-images.sh index release-evidence
          bash scripts/sign-images.sh release-evidence/candidates.json release-evidence/signing release-evidence/release-predicate.json
      - name: Expose only the successfully verified candidate index
        id: candidates
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.passed and .images == 6' release-evidence/signing/result.json > /dev/null
          printf 'source_sha=%s\nrelease_run_id=%s\nrelease_run_attempt=%s\ncandidate_artifact=ocr-candidates-%s-%s-%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          {
            printf '## Tested and signed candidate digests\n\n'
            jq -r '.images[] | "- `" + .role + "`: `" + .reference + "`"' release-evidence/signing/candidates.json
            printf '\nCandidate tags include the commit, run and attempt. No latest alias is promoted.\n'
            printf '\nProcess/deployment checks passed; scientific evaluation is a separate dependent job.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the signed candidate index for read-only evaluation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocr-candidates-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-evidence/signing/candidates.json
            release-evidence/signing/candidates.sigstore.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: inputs.run_sdk_proof == true && startsWith(github.ref, 'refs/tags/v')
        with:
          python-version: '3.13.16'
      - name: Publish separately signed native SDK and actual cooked dependencies
        id: build_inputs
        if: inputs.run_sdk_proof == true && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          bash scripts/publish-native-build-inputs.sh "$PWD/release-evidence" "$RUNNER_TEMP/native-build-inputs"
          printf 'artifact=native-build-inputs-%s-%s-%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Retain immutable build-input identities and source-built baselines
        if: inputs.run_sdk_proof == true && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-build-inputs-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-build-inputs/transport
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Retain build-input diagnostics including partial failures
        if: always() && inputs.run_sdk_proof == true && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-build-producer-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-build-inputs
            !${{ runner.temp }}/native-build-inputs/sdk-oci/**
            !${{ runner.temp }}/native-build-inputs/chef-oci/**
            !${{ runner.temp }}/native-build-inputs/sdk-materialized/sdk/rootfs/**
            !${{ runner.temp }}/native-build-inputs/baseline/**
            !${{ runner.temp }}/native-build-inputs/packet/**
            !${{ runner.temp }}/native-build-inputs/transport/**
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve full release evidence and source materials, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-evidence
            !release-evidence/models/**
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
  evaluation:
    # Scientific execution may instead use the same signed candidates locally.
    if: ${{ inputs.run_evaluation == true }}
    needs: publish
    permissions:
      contents: read
      actions: read
      packages: read
    uses: ./.github/workflows/ocr-evaluation.yml
    with:
      source_sha: ${{ needs.publish.outputs.source_sha }}
      release_run_id: ${{ needs.publish.outputs.release_run_id }}
      release_run_attempt: ${{ needs.publish.outputs.release_run_attempt }}
      candidate_artifact: ${{ needs.publish.outputs.candidate_artifact }}
      include_laboratory: true

  native-build-proof:
    name: Fresh hosted SDK and Chef seven-role proof
    if: inputs.run_sdk_proof == true && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      NATIVE_BUILD_RELEASE_RUN_ID: ${{ needs.publish.outputs.release_run_id }}
      NATIVE_BUILD_RELEASE_RUN_ATTEMPT: ${{ needs.publish.outputs.release_run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.16'
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          version: v29.9.1
          daemon-config: '{"exec-opts":["native.cgroupdriver=systemd"],"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0
          driver: docker
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Install the same checksum-pinned raw OCI reader
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/native-proof-tools"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 180 --retry 2 --retry-max-time 240 \
            https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz \
            --output "$RUNNER_TEMP/native-proof-tools/crane.tar.gz"
          printf '%s  %s\n' 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0 \
            "$RUNNER_TEMP/native-proof-tools/crane.tar.gz" | sha256sum --check --status
          tar -xOf "$RUNNER_TEMP/native-proof-tools/crane.tar.gz" crane > "$RUNNER_TEMP/native-proof-tools/crane"
          chmod 0755 "$RUNNER_TEMP/native-proof-tools/crane"
          printf '%s\n' "$RUNNER_TEMP/native-proof-tools" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.publish.outputs.native_build_artifact }}
          path: ${{ runner.temp }}/native-build-packet
      - name: Prove fresh materialization, seven static roles, full native and lifecycle gates, and invalidation
        run: python3 scripts/native-build-proof.py --packet "$RUNNER_TEMP/native-build-packet" --output "$RUNNER_TEMP/native-build-proof"
      - name: Execute the frozen paired shared-builder cost schedule after correctness
        run: python3 scripts/measure-native-build-cost.py --index "$RUNNER_TEMP/native-build-proof/packet/index.json" --inputs "$RUNNER_TEMP/native-build-proof" --output "$RUNNER_TEMP/native-build-cost"
      - name: Retain complete fresh-runner proof and cost diagnostics including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-build-proof-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-build-proof
            !${{ runner.temp }}/native-build-proof/models/**
            !${{ runner.temp }}/native-build-proof/sdk-oci/**
            !${{ runner.temp }}/native-build-proof/chef-oci/**
            !${{ runner.temp }}/native-build-proof/sdk-materialized/sdk/rootfs/**
            !${{ runner.temp }}/native-build-proof/invalidation/context-*/**
            !${{ runner.temp }}/native-build-proof/invalidation/source.tar
            ${{ runner.temp }}/native-build-cost
            !${{ runner.temp }}/native-build-cost/contexts/**
            !${{ runner.temp }}/native-build-cost/source.tar
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
