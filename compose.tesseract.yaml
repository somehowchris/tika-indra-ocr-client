name: tika-tesseract
services:
  tika:
    image: tika-tesseract:dev
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/tesseract.Dockerfile
      args:
        TIKA_IMAGE: ${TIKA_IMAGE:-tika-indra:dev}
    ports:
      - "127.0.0.1:9998:9998"
    environment:
      OMP_THREAD_LIMIT: "1"
      OMP_NUM_THREADS: "1"
      TESSDATA_PREFIX: "/opt/tessdata-best"
    cpus: 1.0
    mem_limit: 3g
    memswap_limit: 3g
    pids_limit: 128
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges=true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    healthcheck:
      # The baseline has no Indra service; wait for Tika's HTTP listener.
      test: ["CMD", "/opt/indra/tesseract", "--tika-server-ready"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 120s
    stop_grace_period: 90s
    restart: unless-stopped
