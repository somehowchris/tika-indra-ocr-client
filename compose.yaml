name: tika-indra
services:
  tika:
    image: tika-indra:dev
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/tika.Dockerfile
      args:
        BRIDGE_IMAGE: ${BRIDGE_IMAGE:-indra-bridge:dev}
    ports:
      - "127.0.0.1:9998:9998"
    environment:
      INDRA_ADDR: "127.0.0.1:8081"
      INDRA_TIMEOUT_SECONDS: "70"
      INDRA_CONNECT_TIMEOUT_MS: "1000"
    volumes:
      - ./deploy/base/tika-config.xml:/etc/tika/tika-config.xml:ro
    cpus: 0.25
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    healthcheck:
      test: ["CMD", "/opt/indra/tesseract", "--tika-ready"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 120s
    stop_grace_period: 90s
    restart: unless-stopped

  indra:
    image: indra-backend:dev
    platform: linux/amd64
    build:
      context: .
      dockerfile: backend/Dockerfile
    network_mode: "service:tika"
    environment:
      INDRA_HOST: "127.0.0.1"
      INDRA_PORT: "8081"
      INDRA_WORKERS: "1"
      INDRA_THREADS: "1"
      INDRA_MATH: "0"
      INDRA_MODEL_DIR: "/models"
      INDRA_MAX_REQUEST_BYTES: "20971520"
      INDRA_MAX_PIXELS: "25000000"
      INDRA_MAX_RESPONSE_BYTES: "4194304"
      INDRA_QUEUE_CAPACITY: "2"
      INDRA_REQUEST_TIMEOUT_SECONDS: "60"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      XDG_CACHE_HOME: "/tmp/.cache"
    cpus: 0.75
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 64
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    stop_grace_period: 90s
    restart: unless-stopped
