name: tika-indra
services:
  models-init:
    image: ${INDRA_IMAGE:-indra-native:dev}
    platform: linux/amd64
    command: ["--math", "true", "models", "fetch"]
    volumes:
      - model-cache:/models
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 64
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges=true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    restart: "no"

  # This dependency owns the network namespace until Tika has finished draining.
  indra:
    image: ${INDRA_IMAGE:-indra-native:dev}
    platform: linux/amd64
    depends_on:
      models-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${TIKA_PORT:-9998}:9998"
    command: ["--startup-timeout-seconds", "300", "serve"]
    environment:
      INDRA__SERVER__LISTEN: "127.0.0.1:8081"
      INDRA__SERVER__WORKERS: "1"
      INDRA__ENGINE__THREADS: "1"
      INDRA__ENGINE__CV_THREADS: "1"
      INDRA__ENGINE__MATH: "true"
      OMP_NUM_THREADS: "1"
      OMP_THREAD_LIMIT: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - model-cache:/models:ro
    cpus: 0.75
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 128
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges=true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    healthcheck:
      test: ["CMD", "/indra-server", "probe", "ready"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 300s
    stop_grace_period: 100s
    restart: unless-stopped

  tika:
    image: ${TIKA_IMAGE:-tika-indra:dev}
    platform: linux/amd64
    network_mode: "service:indra"
    depends_on:
      indra:
        condition: service_healthy
        restart: true
    command: ["--ocr-ready-endpoint", "127.0.0.1:8081", "serve"]
    environment:
      INDRA_ADDR: "127.0.0.1:8081"
      INDRA_TIMEOUT_SECONDS: "70"
      INDRA_CONNECT_TIMEOUT_MS: "1000"
    volumes:
      - ./deploy/base/tika-config.xml:/etc/tika/tika-config.xml:ro
    cpus: 0.25
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges=true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    healthcheck:
      test: ["CMD", "/indra-gateway", "probe", "ready"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 180s
    stop_grace_period: 350s
    restart: unless-stopped

volumes:
  model-cache:
