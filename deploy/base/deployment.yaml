apiVersion: apps/v1
kind: Deployment
metadata:
  name: tika-indra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tika-indra
  template:
    metadata:
      labels:
        app: tika-indra
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      # Configured allowances: main Tika/gateway 346s, then native OCR <=100s; 4s margin.
      terminationGracePeriodSeconds: 450
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: models-init
          image: indra-native:dev
          imagePullPolicy: IfNotPresent
          args: ["--math", "true", "models", "fetch"]
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: indra-tmp
              mountPath: /tmp

        # Kubernetes >=1.33: the native sidecar warms before Tika starts and is
        # terminated after the main gateway has finished all admitted parses.
        - name: indra
          restartPolicy: Always
          image: indra-native:dev
          imagePullPolicy: IfNotPresent
          args: ["--startup-timeout-seconds", "300", "serve"]
          env:
            - name: INDRA__SERVER__LISTEN
              value: "127.0.0.1:8081"
            - name: INDRA__SERVER__WORKERS
              value: "1"
            - name: INDRA__ENGINE__THREADS
              value: "1"
            - name: INDRA__ENGINE__CV_THREADS
              value: "1"
            - name: INDRA__ENGINE__MATH
              value: "true"
            - name: OMP_NUM_THREADS
              value: "1"
            - name: OMP_THREAD_LIMIT
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
            - name: MKL_NUM_THREADS
              value: "1"
          resources:
            requests:
              cpu: 750m
              memory: 2Gi
            limits:
              cpu: 750m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            exec:
              command: ["/indra-server", "probe", "startup"]
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 180
          readinessProbe:
            exec:
              command: ["/indra-server", "probe", "ready"]
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 1
          livenessProbe:
            exec:
              command: ["/indra-server", "probe", "health"]
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: model-cache
              mountPath: /models
              readOnly: true
            - name: indra-tmp
              mountPath: /tmp

      containers:
        - name: tika
          image: tika-indra:dev
          imagePullPolicy: IfNotPresent
          args: ["--ocr-ready-endpoint", "127.0.0.1:8081", "serve"]
          ports:
            - name: http
              containerPort: 9998
          env:
            - name: INDRA_ADDR
              value: "127.0.0.1:8081"
            - name: INDRA_TIMEOUT_SECONDS
              value: "70"
            - name: INDRA_CONNECT_TIMEOUT_MS
              value: "1000"
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 250m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /startupz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 100
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tika-config
              mountPath: /etc/tika
              readOnly: true
            - name: tika-tmp
              mountPath: /tmp

      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: indra-model-cache
        - name: tika-config
          configMap:
            name: tika-config
        - name: tika-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: indra-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
