[workspace]
members = ["crates/indra-core", "crates/indra-models"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
thiserror = "=2.0.21"
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
mimalloc = "=0.1.52"
stats_alloc = "=0.1.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
overflow-checks = true

[profile.maxperf]
inherits = "release"
lto = "fat"

[profile.profiling]
inherits = "release"
debug = 1
strip = "none"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
redundant_clone = "deny"
implicit_clone = "deny"
large_types_passed_by_value = "deny"

