[package]
name = "indra-models"
description = "Pinned Indra artifacts, offline verification and atomic explicit acquisition"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
fetch = ["dep:reqwest"]

[dependencies]
thiserror.workspace = true
sha2 = "=0.10.9"
libc = "=0.2.191"
reqwest = { version = "=0.13.5", optional = true, default-features = false, features = ["blocking", "rustls"] }

[dev-dependencies]
serde_json = "=1.0.154"
criterion.workspace = true
mimalloc.workspace = true
stats_alloc.workspace = true

[[bench]]
name = "verification"
harness = false

[lints]
workspace = true
