[package]
name = "indra-telemetry"
description = "Bounded, privacy-preserving OCR tracing, metrics and error reporting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry", "dep:reqwest"]
sentry = ["dep:sentry", "dep:reqwest"]

[dependencies]
indra-trace-context = { path = "../../../shared/trace-context" }
serde = { version = "=1.0.229", features = ["derive"] }
thiserror.workspace = true
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["std", "fmt", "json", "env-filter", "registry", "tracing-log"] }
tracing-appender = "=0.2.4"
url = "=2.5.8"
opentelemetry = { version = "=0.32.0", default-features = false, features = ["trace", "metrics", "internal-logs"], optional = true }
opentelemetry_sdk = { version = "=0.32.0", default-features = false, features = ["trace", "metrics", "internal-logs"], optional = true }
opentelemetry-otlp = { version = "=0.32.0", default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-blocking-client", "internal-logs"], optional = true }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"], optional = true }
tracing-opentelemetry = { version = "=0.33.0", default-features = false, optional = true }
sentry = { version = "=0.49.3", default-features = false, features = ["reqwest", "rustls"], optional = true }

[dev-dependencies]
serde_json = "=1.0.154"
prost = "=0.14.4"
opentelemetry-proto = { version = "=0.32.0", default-features = false, features = ["gen-tonic-messages", "trace", "metrics"] }
criterion.workspace = true
stats_alloc.workspace = true

[[bench]]
name = "propagation"
harness = false

[[test]]
name = "allocations"
harness = false

[lints]
workspace = true
