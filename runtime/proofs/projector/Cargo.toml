[package]
name = "indra-proof-projector"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
miette = { version = "=7.6.0", features = ["fancy"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
thiserror = "=2.0.21"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
redundant_clone = "deny"
implicit_clone = "deny"
